<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;box-sizing:border-box;position:relative;background:#13202A;color:#F3F5F2;padding:56px 72px 0;-webkit-font-smoothing:antialiased}
.top{display:flex;justify-content:space-between;font-family:"B612 Mono",monospace;font-size:22px;line-height:1;color:#93A3AE}
h1{font-family:Spectral,Georgia,serif;font-weight:600;font-size:136px;line-height:.92;letter-spacing:-.025em;margin:52px 0 0}
.sub{font-family:Spectral,Georgia,serif;font-style:italic;font-weight:400;font-size:38px;line-height:1.24;color:#C3CDD4;margin:30px 0 0;max-width:960px}
.ribbon{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;gap:5px}
.ribbon i{display:block;height:100%}
</style>
</head>
<body>
<div class="top"><span>Curated by Dr Ganesh Sivasankara</span><span id="totals"></span></div>
<h1 id="h">Built Between<br>Cases</h1>
<p class="sub" id="sub">Tools for anaesthesia and intensive care, built by clinicians, most of them with AI.</p>
<div class="ribbon" id="ribbon"></div>
<script>
const LIGHT = {'#076772': '#40BECF', '#735603': '#CBA553', '#863F61': '#E08DB2', '#6E4885': '#C296DD', '#195F91': '#6CB2EC',
  '#8C4039': '#E88F85', '#505294': '#9DA3EF', '#85490F': '#DF9962', '#5D6002': '#ACB25C', '#216B3C': '#73BF88'};
window.render = async (d) => {
  document.getElementById('totals').textContent = d.tools + ' tools · ' + d.makers + ' makers · ' + d.countries + ' countries';
  document.getElementById('ribbon').replaceChildren(...d.areas.map(([label, n, colour]) => {
    const i = document.createElement('i'); i.style.flex = n + ' 1 0'; i.style.background = LIGHT[colour.toUpperCase()] || colour; return i;
  }));
  await document.fonts.ready;
  const h = document.getElementById('h'), sub = document.getElementById('sub'), rib = document.getElementById('ribbon');
  let size = 136;
  while (sub.getBoundingClientRect().bottom > rib.getBoundingClientRect().top - 40 && size > 90) { size -= 4; h.style.fontSize = size + 'px'; }
  return {size, gap: Math.round(rib.getBoundingClientRect().top - sub.getBoundingClientRect().bottom), fonts: [...document.fonts].filter(f => f.status === 'loaded').map(f => f.family + ' ' + f.weight + ' ' + f.style)};
};
</script>
</body>
</html>
